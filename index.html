<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <div class="container">
        <h1 class="title">
            <span>⛅</span>
            Weather App
        </h1>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">

            <button id="searchBtn">
                Search
            </button>
        </div>

        <div id="loading" class="hidden">
            Loading...
        </div>

        <div id="error" class="hidden">
            City not found!
        </div>



        <div class="weather-card">

            <h2 id="cityName">City Name</h2>

            <div class="icon-wrapper">
                <img id="weatherIcon" src="https://cdn-icons-png.flaticon.com/512/1779/1779940.png" alt="Weather Icon">
            </div>

            <h3 id="temperature">0°C</h3>

            <p id="description">Weather Condition</p>

            <div class="weather-details">

                <div class="detail-card">
                    <h4>💧 Humidity</h4>
                    <span id="humidity">0%</span>
                </div>

                <div class="detail-card">
                    <h4>🌬️ Wind</h4>
                    <span id="wind">0 km/h</span>
                </div>

            </div>

        </div>
    </div>
    <script src="script.js"></script>

</body>

</html>
